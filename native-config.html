<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>原版插件配置</title><style>
:root{color-scheme:light dark;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}body{max-width:900px;margin:30px auto;padding:0 24px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin-right:auto}fieldset{border:1px solid #8886;border-radius:12px;margin:20px 0;padding:18px}legend{font-weight:600}.field{padding:12px 0;border-bottom:1px solid #8883}label{display:block;font-weight:550}small,code{display:block;opacity:.7}input:not([type=checkbox]),textarea,select{box-sizing:border-box;width:100%;padding:9px;margin-top:6px;border:1px solid #8888;border-radius:6px;background:transparent;color:inherit}textarea{min-height:85px}input[type=checkbox]{width:20px;height:20px;margin:10px 0}button{padding:9px 16px;border:1px solid #8888;border-radius:6px;cursor:pointer}#status{min-height:24px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #739cf7}
</style></head><body><header><h1 id="title">原版插件配置</h1><button id="reload" type="button">重新读取</button><button id="save" type="button">保存配置</button></header><p>字段、选项和默认值来自原插件的 _conf_schema.json。保存后应用到当前运行实例。</p><p id="status" role="status"></p><form id="form"></form>
<script>
const plugin=location.pathname.split('/').filter(Boolean)[1],endpoint=location.pathname+'/data';
document.querySelector('#title').textContent=(plugin==='content'?'我会替你留住故事':'梗百科')+' · 原版配置';
const status=document.querySelector('#status'),form=document.querySelector('#form');let revision='',fields=[];
function draw(schema,parent,prefix,values){for(const [key,item] of Object.entries(schema)){const path=prefix+key;if(item.type==='object'){const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=item.description||key;group.append(legend);parent.append(group);draw(item.items||{},group,path+'.',values);continue;}
 const row=document.createElement('div');row.className='field';const label=document.createElement('label');label.htmlFor=path;label.textContent=item.description||key;const code=document.createElement('code');code.textContent=path;
 let input;if(item.options){input=document.createElement('select');item.options.forEach((v,i)=>{const o=document.createElement('option');o.value=v;o.textContent=item.labels?.[i]||v;input.append(o);});}else if(item.type==='text'){input=document.createElement('textarea');}else{input=document.createElement('input');input.type=item.type==='bool'?'checkbox':['int','float'].includes(item.type)?'number':/cookie|password|token|secret|api_key/i.test(key)?'password':'text';if(input.type==='number')input.step=item.type==='int'?'1':'any';}
 input.id=path;const value=values[path]??item.default??'';if(item.type==='bool')input.checked=Boolean(value);else input.value=String(value);row.append(label,code,input);if(item.hint){const hint=document.createElement('small');hint.textContent=item.hint;row.append(hint);}parent.append(row);fields.push({path,item,input});}}
async function load(){try{const response=await fetch(endpoint,{credentials:'same-origin'});const result=await response.json();if(!response.ok)throw Error(result.error||'读取失败');revision=result.revision;fields=[];form.replaceChildren();draw(result.schema,form,'',result.values);status.textContent='已读取全部 '+fields.length+' 项原版配置。';}catch(error){status.textContent=String(error);}}
document.querySelector('#reload').onclick=load;document.querySelector('#save').onclick=async()=>{const button=document.querySelector('#save');button.disabled=true;try{const values={};for(const {path,item,input} of fields)values[path]=item.type==='bool'?input.checked:['int','float'].includes(item.type)?Number(input.value):input.value;const response=await fetch(endpoint,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,values})});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');revision=result.revision;status.textContent='已保存并应用全部配置。';}catch(error){status.textContent=String(error);}finally{button.disabled=false;}};load();
</script></body></html>
